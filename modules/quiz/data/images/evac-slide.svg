<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350">
  <rect width="400" height="350" fill="#E3F2FD" rx="8"/>
  <text x="200" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1565C0">Надувной трап-плот</text>
  <!-- Aircraft door frame -->
  <rect x="140" y="40" width="120" height="180" fill="#B0BEC5" stroke="#546E7A" stroke-width="3" rx="4"/>
  <rect x="155" y="55" width="90" height="150" fill="#90A4AE" stroke="#546E7A" stroke-width="2" rx="2"/>
  <!-- Slide deployed -->
  <polygon points="155,205 50,330 350,330 245,205" fill="#F44336" stroke="#C62828" stroke-width="2" opacity="0.85"/>
  <!-- Slide segments -->
  <line x1="120" y1="260" x2="280" y2="260" stroke="#C62828" stroke-width="1.5" opacity="0.5"/>
  <line x1="90" y1="295" x2="310" y2="295" stroke="#C62828" stroke-width="1.5" opacity="0.5"/>
  <!-- Raft at bottom -->
  <ellipse cx="200" cy="330" rx="150" ry="15" fill="#C62828" stroke="#8B1A24" stroke-width="2"/>
  <ellipse cx="200" cy="330" rx="120" ry="10" fill="#E57373"/>
  <!-- People silhouettes on slide -->
  <circle cx="170" cy="250" r="5" fill="#FFFFFF"/>
  <circle cx="230" cy="280" r="5" fill="#FFFFFF"/>
  <circle cx="200" cy="310" r="5" fill="#FFFFFF"/>
  <!-- Arrow showing direction -->
  <path d="M200,230 L200,300" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <polygon points="195,295 200,305 205,295" fill="#FFFFFF" opacity="0.6"/>
</svg>