<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#E8F5E9" rx="8"/>
  <text x="250" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2E7D32">PAPI — Система визуальной индикации глиссады</text>
  <!-- Runway -->
  <rect x="50" y="200" width="400" height="60" fill="#37474F" rx="2"/>
  <line x1="50" y1="230" x2="450" y2="230" stroke="#FDD835" stroke-width="2" stroke-dasharray="20,15"/>
  <!-- PAPI lights -->
  <g transform="translate(130,160)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="#C62828"/>
    <circle cx="15" cy="15" r="10" fill="#FF5252"/>
  </g>
  <g transform="translate(170,160)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="#C62828"/>
    <circle cx="15" cy="15" r="10" fill="#FF5252"/>
  </g>
  <g transform="translate(210,160)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="#EEEEEE"/>
    <circle cx="15" cy="15" r="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  </g>
  <g transform="translate(250,160)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="#EEEEEE"/>
    <circle cx="15" cy="15" r="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
  </g>
  <!-- Labels -->
  <text x="145" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C62828">●●</text>
  <text x="225" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9E9E9E">◯◯</text>
  <text x="250" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2E7D32">2 красных + 2 белых = на глиссаде</text>
</svg>