<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#ECEFF1" rx="8"/>
  <text x="320" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#37474F">Багажный тягач (тягач-пушер)</text>
  <!-- Ground -->
  <rect x="0" y="280" width="640" height="80" fill="#B0BEC5"/>
  <!-- Tractor body -->
  <rect x="80" y="210" width="140" height="70" fill="#FDD835" stroke="#F9A825" stroke-width="2" rx="6"/>
  <!-- Cabin -->
  <rect x="170" y="180" width="50" height="65" fill="#FDD835" stroke="#F9A825" stroke-width="2" rx="4"/>
  <rect x="178" y="188" width="34" height="30" fill="#E3F2FD" stroke="#90A4AE" stroke-width="1" rx="2"/>
  <!-- Wheels -->
  <circle cx="110" cy="282" r="18" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <circle cx="110" cy="282" r="8" fill="#78909C"/>
  <circle cx="190" cy="282" r="18" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <circle cx="190" cy="282" r="8" fill="#78909C"/>
  <!-- Drawbar -->
  <line x1="220" y1="260" x2="310" y2="260" stroke="#546E7A" stroke-width="6"/>
  <!-- Cart/Dolly -->
  <rect x="310" y="220" width="260" height="60" fill="#78909C" stroke="#546E7A" stroke-width="2" rx="4"/>
  <rect x="320" y="195" width="80" height="25" fill="#90A4AE" stroke="#546E7A" stroke-width="1" rx="2"/>
  <rect x="420" y="195" width="80" height="25" fill="#90A4AE" stroke="#546E7A" stroke-width="1" rx="2"/>
  <!-- Cart wheels -->
  <circle cx="350" cy="282" r="14" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <circle cx="350" cy="282" r="6" fill="#78909C"/>
  <circle cx="530" cy="282" r="14" fill="#37474F" stroke="#263238" stroke-width="2"/>
  <circle cx="530" cy="282" r="6" fill="#78909C"/>
  <!-- Warning stripes -->
  <g opacity="0.7">
    <rect x="80" y="248" width="20" height="6" fill="#212121" transform="skewX(-30)"/>
    <rect x="100" y="248" width="20" height="6" fill="#212121" transform="skewX(-30)"/>
  </g>
  <!-- Light -->
  <circle cx="80" cy="230" r="6" fill="#F44336"/>
  <circle cx="80" cy="230" r="3" fill="#FF8A80"/>
</svg>