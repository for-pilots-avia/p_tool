<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cd202c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PilotTool">
  <meta name="description" content="Авиационный инструмент пилота — ФРВ, справочники">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Pilot's Tool</title>
</head>
<body>

  <!-- Прогресс-бар SW: первый элемент в <body>, до #cacheProgressOverlay -->
  <div id="swProgressBar" style="
    position: fixed; top: 0; left: 0; right: 0; z-index: 10000;
    height: 3px; pointer-events: none;
  ">
    <div id="swProgressFill" style="
      height: 3px; width: 0%; background: #CD202C;
      transition: width 0.2s ease;
    "></div>
  </div>

  <!-- Оверлей прогресса первой установки SW -->
  <div id="cacheProgressOverlay" style="
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #CD202C;
    flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif;
  ">
    <div style="margin-bottom: 16px;"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
    <p style="margin-bottom: 16px; font-size: 1rem;">Подготовка к работе offline...</p>
    <div style="width: 240px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;">
      <div id="cacheProgressBar" style="
        height: 4px; width: 0%; background: #fff;
        border-radius: 2px; transition: width 0.2s ease;
      "></div>
    </div>
    <p id="cacheProgressText" style="margin-top: 12px; font-size: 0.875rem; opacity: 0.8;">0%</p>
    <p id="cacheProgressFile" style="margin-top: 8px; font-size: 0.75rem; opacity: 0.6; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></p>
  </div>

  <!-- Затемнение при обновлении SW -->
  <div id="swUpdateOverlay" class="sw-update-overlay"></div>

  <!-- Баннер обновления SW -->
  <div id="swUpdateBanner" style="
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9998;
    background: #1a1a1a; color: #fff;
    padding: 12px 16px; font-family: sans-serif; font-size: 0.875rem;
    flex-direction: column; gap: 8px;
  ">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span id="swUpdateBannerText">Загружается обновление...</span>
      <button id="swUpdateReloadBtn" style="
        background: #CD202C; color: #fff; border: none;
        padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.875rem;
        display: none;
      ">Обновить</button>
    </div>
    <span id="swUpdateFile" style="font-size: 0.75rem; opacity: 0.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
    <div id="swUpdateProgress" style="
      height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden;
    ">
      <div id="swUpdateProgressFill" style="
        height: 3px; width: 0%; background: #CD202C;
        transition: width 0.2s ease;
      "></div>
    </div>
  </div>

  <div id="app">

    <!-- ═══ HEADER ═══ -->
    <header class="header" id="appHeader">
      <div class="header-inner">
        <div id="headerLeft"></div>
        <div id="headerCenter"></div>
        <div id="headerRight"></div>
      </div>
    </header>

    <!-- ═══ SIDE MENU ═══ -->
    <div id="menuOverlay" class="menu-overlay"></div>

    <nav id="sideMenu" class="side-menu">
      <button class="menu-home-btn" onclick="app.navigateTo('main')" aria-label="Главный экран">
        <span id="menuHomeIcon"></span>
        <span>Главный экран</span>
      </button>

      <ul class="menu-list" id="menuList">
        <!-- Menu items are generated dynamically by app.js from registry -->
      </ul>

      <div class="menu-divider"></div>

      <ul class="menu-list menu-list--controls">
        <li class="menu-item" id="themeToggle">
          <span class="menu-icon" id="themeIcon"></span>
          <span id="themeLabel">Ночной режим</span>
        </li>
      </ul>

      <div id="offlineStatus" class="menu-offline-status">
        <div class="menu-offline-row">
          <span class="menu-offline-icon" id="offlineStatusIcon"></span>
          <span id="offlineStatusText">Загрузка ресурсов...</span>
        </div>
      </div>

      <!-- Плашка обновления JSON-данных -->
      <div id="updateBadge" class="update-badge update-badge-hidden">
        <span id="updateBadgeIcon"></span>
        <span class="update-badge-text"></span>
        <button id="updateBadgeClose" class="update-badge-close" aria-label="Закрыть">✕</button>
      </div>
    </nav>

    <!-- ═══ SCREENS ═══ -->

    <!-- Main Screen -->
    <div id="mainScreen" class="screen">
      <div class="main-bg"></div>
      <div class="main-content">
        <div class="main-quote-wrapper">
          <span class="main-quote-mark main-quote-mark--open" aria-hidden="true">❝</span>
          <div class="main-quote" id="mainQuote" aria-live="polite" aria-atomic="true"><span class="main-quote-text" id="mainQuoteText"></span><span class="main-quote-cursor" id="mainQuoteCursor" aria-hidden="true"></span></div>
          <span class="main-quote-mark main-quote-mark--close" aria-hidden="true">❞</span>
        </div>
      </div>
      <button id="notesQuickBtn" class="notes-quick-btn" aria-label="Быстрое рисование"></button>
    </div>

    <!-- 1. Worktime Screen -->
    <div id="worktimeScreen" class="screen">
      <div id="worktimeContainer"></div>
    </div>

    <!-- 2. Metbriefing Screen -->
    <div id="metbriefingScreen" class="screen">
      <div id="metbriefingContainer"></div>
    </div>

    <!-- 3. Checklists Screen -->
    <div id="checklistsScreen" class="screen">
      <div id="checklistsContainer"></div>
    </div>

    <!-- 4. KRS Screen -->
    <div id="krsScreen" class="screen">
      <div id="krsContainer"></div>
    </div>

    <!-- 5. Flight Procedures Screen -->
    <div id="flightproceduresScreen" class="screen">
      <div id="flightproceduresContainer"></div>
    </div>

    <!-- 6. Rules of Thumb Screen -->
    <div id="rulesthumbScreen" class="screen">
      <div id="rulesthumbContainer"></div>
    </div>

    <!-- 7. Survey Screen -->
    <div id="surveyScreen" class="screen">
      <div id="surveyContainer"></div>
    </div>

    <!-- 8. FFS Training Screen -->
    <div id="ffstrainingScreen" class="screen">
      <div id="ffstrainingContainer"></div>
    </div>

    <!-- 9. Checkride Screen -->
    <div id="checkrideScreen" class="screen">
      <div id="checkrideContainer"></div>
    </div>

    <!-- 10. Quiz Screen -->
    <div id="quizScreen" class="screen">
      <div id="quizContainer"></div>
    </div>

    <!-- 11. Phonebook Screen -->
    <div id="phonebookScreen" class="screen">
      <div id="phonebookContainer"></div>
    </div>

    <!-- 12. Notes Screen -->
    <div id="notesScreen" class="screen">
      <div id="notesContainer"></div>
    </div>

    <!-- 13. FAQ Screen -->
    <div id="faqScreen" class="screen">
      <div id="faqContainer"></div>
    </div>

    <!-- ═══ GLOBAL TOAST ═══ -->
    <div id="globalToast" class="global-toast"></div>

    <!-- ═══ GLOBAL CONFIRM DIALOG ═══ -->
    <div id="globalConfirmOverlay" class="global-confirm-overlay">
      <div class="global-confirm-sheet">
        <p id="globalConfirmMessage" class="global-confirm-message"></p>
        <div class="global-confirm-actions">
          <button id="globalConfirmOk" class="global-confirm-btn-ok">Подтвердить</button>
          <button id="globalConfirmCancel" class="global-confirm-btn-cancel">Отмена</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══ SCRIPTS (loaded in order) ═══ -->
  <script src="icons.js"></script>
  <script src="modules/registry.js"></script>
  <script src="modules/worktime/index.js"></script>
  <script src="modules/metbriefing/index.js"></script>
  <script src="modules/checklists/index.js"></script>
  <script src="modules/krs/index.js"></script>
  <script src="modules/flightprocedures/index.js"></script>
  <script src="modules/rulesthumb/index.js"></script>
  <script src="modules/survey/index.js"></script>
  <script src="modules/ffstraining/index.js"></script>
  <script src="modules/checkride/index.js"></script>
  <script src="modules/quiz/index.js"></script>
  <script src="modules/phonebook/index.js"></script>
  <script src="modules/notes/index.js"></script>
  <script src="modules/faq/index.js"></script>
  <script src="app.js"></script>
  <script>app.initServiceWorker();</script>
</body>
</html>
